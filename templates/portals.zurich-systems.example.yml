# Portal Scanner Configuration — Zurich / Switzerland, systems & infrastructure
# ============================================================================
# A turn-key starting point for a Staff/Principal/Lead systems engineer
# searching in Zurich and the wider Swiss / EU-remote market:
# distributed systems, reliability/SRE, platform, storage, HPC, performance,
# and research-engineer roles.
#
# It is the smaller, focused sibling of templates/portals.example.yml (which
# carries 100+ companies with an AI/automation slant). Pick whichever fits.
#
# QUICK START (see docs/zurich-quickstart.md for the full walkthrough):
#   1. cp templates/portals.zurich-systems.example.yml portals.yml
#   2. Tweak title_filter.positive to YOUR exact target titles
#   3. Add companies under tracked_companies (the scanner auto-detects
#      Greenhouse / Ashby / Lever / Workday from the careers_url)
#   4. Run:  /career-ops scan   (or: node scan.mjs)

# -- Location filter --------------------------------------------------------
# Keeps results to Switzerland and remote-in-Europe. `always_allow` rescues
# multi-location postings ("5 Locations") that include your region. Empty or
# non-string locations always pass, so nothing is dropped on missing data.
location_filter:
  always_allow:
    - "Switzerland"
    - "Zurich"
    - "Zürich"
  allow:
    - "Switzerland"
    - "Schweiz"
    - "Suisse"
    - "Svizzera"
    - "Zurich"
    - "Zürich"
    - "Geneva"
    - "Basel"
    - "Lausanne"
    - "Zug"
    - "Remote"
    - "Europe"
    - "EMEA"
  block: []

# -- Title filter -----------------------------------------------------------
# A title passes when >=1 positive matches AND 0 negatives match (case-insensitive).
# Tuned for senior systems/infra/reliability/storage/research engineering.
title_filter:
  positive:
    # Seniority / leadership
    - "Staff Engineer"
    - "Principal Engineer"
    - "Distinguished Engineer"
    - "Senior Software Engineer"
    - "Senior Systems"
    - "Engineering Manager"
    - "Tech Lead"
    - "Technical Lead"
    - "Head of Engineering"
    - "Head of Infrastructure"
    - "Head of Platform"
    - "Director of Engineering"
    # Systems / reliability / infrastructure
    - "Distributed Systems"
    - "Systems Engineer"
    - "Infrastructure"
    - "Platform Engineer"
    - "Reliability"
    - "SRE"
    - "Site Reliability"
    - "Observability"
    - "Kubernetes"
    - "Backend Engineer"
    - "Performance"
    # Storage / low-level / HPC
    - "Storage"
    - "Firmware"
    - "Compiler"
    - "HPC"
    - "Accelerator"
    - "Architect"
    # Research-adjacent
    - "Research Engineer"
  negative:
    - "Junior"
    - "Intern"
    - "Working Student"
    - "Graduate"
    - "Apprentice"
    - "Frontend"
    - "iOS"
    - "Android"
    - "Salesforce"
    - "SAP "
    - "Sales"
    - "Account Executive"
    - "Recruiter"
    - "Marketing"
    - "Solution Architect"   # NVIDIA et al. use this for pre-sales, not systems eng

# -- Companies --------------------------------------------------------------
# The scanner auto-detects the provider from the careers_url:
#   *.greenhouse.io  → greenhouse     *.ashbyhq.com → ashby
#   *.lever.co       → lever          *.myworkdayjobs.com → workday (set provider: workday)
# Big-tech offices in Zurich (Google, Meta, Apple, Microsoft, Oracle Labs) run
# bespoke ATSes that are NOT API-scannable — track those manually / via Playwright.
#
# NVIDIA (Zurich AI lab) runs on Workday. Find the locationHierarchy1 facet id
# for your region in the `facets` array of any CXS response (see
# docs/zurich-quickstart.md), then drop it in below.
tracked_companies:
  - name: NVIDIA
    provider: workday
    careers_url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
    workday:
      facets:
        locationHierarchy1: ["<switzerland-facet-id>"]   # see quickstart to find this
      location_label: "Switzerland"
    enabled: true

  # Add more here. Examples of how each provider looks once you have the board URL:
  # - name: Example (Greenhouse)
  #   careers_url: https://job-boards.greenhouse.io/<company>
  #   enabled: true
  # - name: Example (Ashby)
  #   careers_url: https://jobs.ashbyhq.com/<company>
  #   enabled: true
  # - name: Example (Lever)
  #   careers_url: https://jobs.lever.co/<company>
  #   enabled: true
  #
  # Tip: the big portals.example.yml already has 100+ companies with verified
  # provider mappings — copy any that interest you straight into this file.
